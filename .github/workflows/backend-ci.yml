name: Backend CI

# Corre en la rama del backend. El frontend vive en otra rama del mismo repo y
# tiene (tendrá) su propio workflow.
on:
  push:
    branches: [backend/api]
  pull_request:
    branches: [backend/api]
  workflow_dispatch:

jobs:
  tests:
    name: Tests en Linux
    runs-on: ubuntu-latest
    env:
      # settings.py aborta sin esta variable. Es de usar y tirar: la real vive
      # en los secretos de la plataforma (decisión F4).
      DJANGO_SECRET_KEY: solo-para-ci
      DJANGO_DEBUG: 'False'
      # No hay Postgres en CI y no hace falta: los 19 tests son SimpleTestCase y
      # ninguno se conecta. Pero Django calcula la firma de la base por defecto
      # antes de correrlos, y si NAME es None revienta con un TypeError. En local
      # estos valores salen del .env, que en CI no existe. Son de mentira a
      # propósito: si algún test intentara conectarse, fallaría de inmediato en
      # vez de tocar algo real.
      DB_NAME: ci_sin_conexion
      DB_ADMIN_USER: ci
      DB_ADMIN_PASSWORD: ci
      DB_STANDARD_USER: ci
      DB_STANDARD_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: manage.py check
        run: python Manage.py check

      # Sin argumento de módulo: así el descubrimiento tiene que encontrar los
      # tests por sí solo. En Linux el patrón "test*.py" distingue mayúsculas,
      # de modo que este paso también protege contra un "Ran 0 tests" en falso.
      - name: Tests
        run: python Manage.py test api --verbosity 2

  imagen:
    name: Imagen Docker + Carta Porte real
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t controldemaniobras-api:ci .

      # El paso que de verdad importa: LibreOffice headless convirtiendo el
      # .xlsx a PDF dentro del contenedor. Es lo más frágil del despliegue y no
      # se puede comprobar en Windows.
      - name: Generar una Carta Porte en PDF dentro del contenedor
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=solo-para-ci \
            controldemaniobras-api:ci \
            python smoke_pdf.py

      - name: Comprobar que gunicorn arranca y WhiteNoise sirve los estáticos
        run: |
          docker run -d --name api-ci -p 8000:8000 \
            -e DJANGO_SECRET_KEY=solo-para-ci \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            controldemaniobras-api:ci
          URL=http://127.0.0.1:8000/static/admin/css/base.css

          # Con DEBUG=False se activa SECURE_SSL_REDIRECT, así que hay que
          # mandar X-Forwarded-Proto: https igual que hará el ingress de Azure
          # Container Apps. De paso esto valida SECURE_PROXY_SSL_HEADER: si
          # estuviera mal, aquí saldría un bucle de redirecciones.
          #
          # Se pide un estático del admin a propósito: lo sirve WhiteNoise sin
          # tocar la base de datos (en CI no hay Postgres), así que valida de
          # una vez que gunicorn levantó, que collectstatic corrió en el build
          # y que WhiteNoise encuentra el resultado.
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' "$URL" || true)
            if [ "$code" = "200" ]; then echo "WhiteNoise sirve los estaticos (200)"; ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "El contenedor no respondio 200 a tiempo (ultimo codigo: $code). Logs:"
            docker logs api-ci
            exit 1
          fi

          # La otra cara: sin la cabecera del proxy tiene que redirigir a HTTPS.
          # Es una propiedad de seguridad que conviene dejar fijada.
          code_sin_tls=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
          if [ "$code_sin_tls" != "301" ]; then
            echo "Se esperaba un 301 a HTTPS sin X-Forwarded-Proto, y llego $code_sin_tls"
            exit 1
          fi
          echo "Redireccion a HTTPS activa (301 sin la cabecera del proxy)"

      - name: Logs del contenedor (si algo falló)
        if: failure()
        run: docker logs api-ci || true

      - name: Limpiar
        if: always()
        run: docker rm -f api-ci || true

  desplegar:
    name: Publicar imagen y desplegar en Azure
    runs-on: ubuntu-latest
    needs: imagen
    # Solo desde la rama del backend, nunca desde un pull request: un PR de un
    # fork no debe poder desplegar a producción.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/backend/api'
    # Necesarios para OIDC: GitHub firma un token por ejecución y Azure lo valida
    # contra este repositorio y esta rama. No hay ninguna contraseña almacenada.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Autenticar en Azure (OIDC, sin secretos)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Construir y publicar en el registry
        run: |
          az acr login --name acrcdmfraba
          IMG=acrcdmfraba.azurecr.io/controldemaniobras-api
          # Se etiqueta con el SHA del commit además de 'latest': así siempre se
          # puede volver a una imagen concreta sin depender de un tag móvil.
          docker build -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"

      - name: Desplegar en la Web App
        run: |
          az webapp config container set \
            --resource-group rg-cdm-prod \
            --name app-cdm-fraba \
            --container-image-name "acrcdmfraba.azurecr.io/controldemaniobras-api:${{ github.sha }}" \
            --container-registry-url https://acrcdmfraba.azurecr.io
          # La Web App baja la imagen con su identidad administrada (rol AcrPull),
          # así que no hay usuario ni contraseña de registry en ninguna parte.
          az webapp config set \
            --resource-group rg-cdm-prod \
            --name app-cdm-fraba \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'
          az webapp restart --resource-group rg-cdm-prod --name app-cdm-fraba

      - name: Comprobar que producción responde
        run: |
          URL=https://app-cdm-fraba.azurewebsites.net/static/admin/css/base.css
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then echo "produccion responde 200"; exit 0; fi
            echo "  intento $i: $code"
            sleep 10
          done
          echo "produccion no respondio a tiempo (ultimo codigo: $code)"
          az webapp log tail --resource-group rg-cdm-prod --name app-cdm-fraba --provider docker &
          sleep 20
          exit 1
